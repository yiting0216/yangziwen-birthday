// ============ Page navigation ============
function showPage(pageId) {
  document.querySelectorAll('.page').forEach(p => {
    p.classList.remove('active', 'fade-in');
  });
  const target = document.getElementById(pageId);
  target.classList.add('active', 'fade-in');
}

// ============ Fireworks Engine ============
function createFireworks(canvasId, duration) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const rockets = [];
  const colors = ['#ff6b8a', '#ffd700', '#8b5cf6', '#00d4ff', '#ff8c42', '#ff69b4', '#7fff00'];

  class Rocket {
    constructor() {
      this.x = Math.random() * canvas.width;
      this.y = canvas.height;
      this.targetY = Math.random() * canvas.height * 0.4 + 50;
      this.speed = 6 + Math.random() * 4;
      this.color = colors[Math.floor(Math.random() * colors.length)];
      this.trail = [];
    }
    update() {
      this.trail.push({x: this.x, y: this.y});
      if (this.trail.length > 8) this.trail.shift();
      this.y -= this.speed;
      if (this.y <= this.targetY) {
        this.explode();
        return false;
      }
      return true;
    }
    explode() {
      const count = 60 + Math.floor(Math.random() * 40);
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count;
        const speed = 2 + Math.random() * 4;
        particles.push(new Particle(this.x, this.y, angle, speed, this.color));
      }
    }
    draw() {
      ctx.beginPath();
      this.trail.forEach((p, i) => {
        ctx.globalAlpha = i / this.trail.length;
        ctx.fillStyle = this.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      });
      ctx.globalAlpha = 1;
    }
  }

  class Particle {
    constructor(x, y, angle, speed, color) {
      this.x = x; this.y = y;
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
      this.color = color;
      this.life = 1;
      this.decay = 0.012 + Math.random() * 0.008;
      this.size = 2 + Math.random() * 2;
    }
    update() {
      this.x += this.vx;
      this.y += this.vy;
      this.vy += 0.05;
      this.vx *= 0.99;
      this.life -= this.decay;
      return this.life > 0;
    }
    draw() {
      ctx.globalAlpha = this.life;
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  let running = true;
  let rocketTimer = 0;

  function animate() {
    if (!running) return;
    ctx.fillStyle = 'rgba(232, 223, 245, 0.15)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    rocketTimer++;
    if (rocketTimer > 25) {
      rocketTimer = 0;
      rockets.push(new Rocket());
    }

    for (let i = rockets.length - 1; i >= 0; i--) {
      if (!rockets[i].update()) rockets.splice(i, 1);
      else rockets[i].draw();
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      if (!particles[i].update()) particles.splice(i, 1);
      else particles[i].draw();
    }
    requestAnimationFrame(animate);
  }
  animate();

  if (duration) {
    setTimeout(() => { running = false; }, duration);
  }
  return () => { running = false; };
}

// ============ Opening sequence ============
window.addEventListener('load', () => {

// ============ Photo Wall ============
let photoWallInitialized = false;
let heartPositions = [];
let scatterPositions = [];

function generateHeartPositions(count) {
  const positions = [];
  const centerX = 350, centerY = 280;
  const scale = 14;
  for (let i = 0; i < count; i++) {
    const t = (i / count) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    positions.push({
      x: centerX + x * scale - 45,
      y: centerY + y * scale - 45
    });
  }
  return positions;
}

function generateScatterPositions(count) {
  const positions = [];
  for (let i = 0; i < count; i++) {
    positions.push({
      x: Math.random() * 580,
      y: Math.random() * 480,
      rotate: (Math.random() - 0.5) * 40
    });
  }
  return positions;
}

function initPhotoWall() {
  if (photoWallInitialized) return;
  photoWallInitialized = true;

  const wall = document.getElementById('photoWall');
  heartPositions = generateHeartPositions(photoFiles.length);
  scatterPositions = generateScatterPositions(photoFiles.length);

  photoFiles.forEach((file, i) => {
    const div = document.createElement('div');
    div.className = 'photo-item';
    div.innerHTML = `<img src="photos/${file}" alt="回忆${i+1}" loading="lazy">`;
    div.style.left = heartPositions[i].x + 'px';
    div.style.top = heartPositions[i].y + 'px';
    div.dataset.index = i;
    wall.appendChild(div);
  });
}

function scatterPhotos() {
  const items = document.querySelectorAll('.photo-item');
  items.forEach((item, i) => {

    item.style.left = pos.x + 'px';
    item.style.top = pos.y + 'px';
    item.style.transform = `rotate(${pos.rotate}deg)`;
  });
}

// ============ Gesture Recognition ============
let gestureInitialized = false;
let currentGesture = 'heart';

async function initGesture() {
  if (gestureInitialized) return;
  gestureInitialized = true;

  const statusEl = document.getElementById('gestureStatus');
  const video = document.getElementById('cameraPreview');

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
    video.srcObject = stream;
    statusEl.textContent = '手势识别：已启动';

    // Load MediaPipe Hands
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js';
    script.onload = () => {
      const hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });
      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.5
      });
      hands.onResults((results) => {
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
          const landmarks = results.multiHandLandmarks[0];
          const gesture = detectGesture(landmarks);
          if (gesture === 'open' && currentGesture !== 'scatter') {
            currentGesture = 'scatter';
            scatterPhotos();
            statusEl.textContent = '🖐 手掌张开 - 照片散开';
          } else if (gesture === 'fist' && currentGesture !== 'heart') {
            currentGesture = 'heart';
            formHeart();
            statusEl.textContent = '✊ 握拳 - 组成爱心';
          }
        }
      });

      async function processFrame() {
        if (video.readyState >= 2) {
          await hands.send({ image: video });
        }
        requestAnimationFrame(processFrame);
      }
      processFrame();
    };
    document.head.appendChild(script);
  } catch (err) {
    statusEl.textContent = '摄像头未授权，可用按钮切换';
    // Add fallback buttons
    const hint = document.querySelector('.gesture-hint');
    hint.innerHTML = '<button onclick="scatterPhotos()" style="padding:8px 20px;margin:0 10px;border:none;border-radius:15px;background:#b48cff;color:#fff;cursor:pointer;">🖐 散开</button><button onclick="formHeart()" style="padding:8px 20px;margin:0 10px;border:none;border-radius:15px;background:#b48cff;color:#fff;cursor:pointer;">✊ 爱心</button>';
  }
}

function detectGesture(landmarks) {
  // landmarks: 0=wrist, 4=thumb tip, 8=index tip, 12=middle tip, 16=ring tip, 20=pinky tip
  // 5,9,13,17 = MCP joints
  const wrist = landmarks[0];
  const tips = [landmarks[8], landmarks[12], landmarks[16], landmarks[20]];
  const mcps = [landmarks[5], landmarks[9], landmarks[13], landmarks[17]];

  let extended = 0;
  for (let i = 0; i < 4; i++) {
    const tipDist = Math.hypot(tips[i].x - wrist.x, tips[i].y - wrist.y);
    const mcpDist = Math.hypot(mcps[i].x - wrist.x, mcps[i].y - wrist.y);
    if (tipDist > mcpDist * 1.3) extended++;
  }

  if (extended >= 3) return 'open';
  if (extended <= 1) return 'fist';
  return 'neutral';
}

// ============ Stars ============
let starsInitialized = false;
let collectedCount = 0;

function initStars() {
  if (starsInitialized) return;
  starsInitialized = true;

  const container = document.getElementById('starsContainer');
  const positions = [];

  // Generate non-overlapping positions
  for (let i = 0; i < 21; i++) {
    let x, y, valid;
    let attempts = 0;
    do {
      x = Math.random() * 740 + 20;
      y = Math.random() * 390 + 20;
      valid = true;
      for (const p of positions) {
        if (Math.hypot(p.x - x, p.y - y) < 55) { valid = false; break; }
      }
      attempts++;
    } while (!valid && attempts < 100);
    positions.push({x, y});

    const star = document.createElement('div');
    star.className = 'star';
    star.textContent = '⭐';
    star.style.left = x + 'px';
    star.style.top = y + 'px';
    star.style.animationDelay = (i * 0.1) + 's';
    star.addEventListener('click', function() {
      if (this.classList.contains('collected')) return;
      this.classList.add('collected');
      collectedCount++;
      document.getElementById('starsCounter').textContent = `已收集：${collectedCount} / 21`;
      showBlessing();
      if (collectedCount >= 21) {
        setTimeout(() => {
          document.getElementById('starsNext').style.display = 'block';
        }, 800);
      }
    });
    container.appendChild(star);
  }
}

function showBlessing() {
  const popup = document.getElementById('blessingPopup');
  const blessing = blessings[Math.floor(Math.random() * blessings.length)];
  popup.textContent = blessing;
  popup.classList.add('show');
  setTimeout(() => popup.classList.remove('show'), 1800);
}

// ============ Cake ============
let cakeInitialized = false;
let blownCount = 0;

function initCake() {
  if (cakeInitialized) return;
  cakeInitialized = true;

  createCandles('candlesTop', 5);
  createCandles('candlesMiddle', 7);
  createCandles('candlesBottom', 9);
}

function createCandles(containerId, count) {
  const container = document.getElementById(containerId);
  for (let i = 0; i < count; i++) {
    const candle = document.createElement('div');
    candle.className = 'candle';
    candle.innerHTML = '<div class="flame"></div>';
    candle.addEventListener('mouseenter', function() {
      if (!this.classList.contains('blown')) {
        this.classList.add('blown');
        blownCount++;
        document.getElementById('cakeProgress').textContent = `已吹灭：${blownCount} / 21`;
        if (blownCount >= 21) {
          document.getElementById('wishDoneBtn').disabled = false;
        }
      }
    });
    // Also support click for touch devices
    candle.addEventListener('click', function() {
      if (!this.classList.contains('blown')) {
        this.classList.add('blown');
        blownCount++;
        document.getElementById('cakeProgress').textContent = `已吹灭：${blownCount} / 21`;
        if (blownCount >= 21) {
          document.getElementById('wishDoneBtn').disabled = false;
        }
      }
    });
    container.appendChild(candle);
  }
}

document.getElementById('wishDoneBtn').addEventListener('click', function() {
  if (this.disabled) return;
  showPage('letter');
  createFireworks('finalFireworks');
});
